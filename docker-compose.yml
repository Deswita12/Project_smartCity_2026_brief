services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sct_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    networks:
      - sct_network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: sct_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - sct_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: sct_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sct_db
      MYSQL_USER: sct_user
      MYSQL_PASSWORD: sct_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3309:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sct_network

networks:
  sct_network:
    driver: bridge

volumes:
  db_data:
